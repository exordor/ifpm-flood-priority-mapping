# IFPM pipeline configuration.
#
# Running `python bin/pipeline.py run` (no arguments) executes the full
# pipeline from this config: all stages, in dependency order, skipping
# scripts whose outputs are already fresh.
#
# Override on the command line:
#   python bin/pipeline.py run                      # full pipeline (this file)
#   python bin/pipeline.py run --target <name>      # one script + upstream
#   python bin/pipeline.py run factors              # one stage
#   python bin/pipeline.py run --force              # re-run everything
#   python bin/pipeline.py run --config other.yaml  # use a different config

# Stages to run, in canonical pipeline order. Omit a stage to skip it.
stages:
  - acquire
  - factors
  - criteria
  - scenarios
  - visualize
  - package
  - investigate

# The default and stage-level commands run only this Peru-first current chain.
# Historical Zimbabwe, equal-weight, superseded figure, and network acquisition
# scripts remain callable explicitly with --target when needed.
include:
  - preprocess_peru_former_srtm_dem
  - derive_peru_former_slope
  - derive_peru_former_hydrology
  - derive_peru_former_ls_factor
  - derive_peru_former_worldcover_cfactor
  - extract_peru_former_ingemmet_mining
  - extract_inei_arequipa_poverty
  - build_peru_former_osm_proximity_criteria
  - build_peru_former_soil_k_factor
  - build_peru_former_criteria_stack
  - build_peru_former_exposure_indicators
  - build_pim_environmental_sensitivity
  - run_peru_former_priority_scenarios
  - summarize_peru_former_criterion_dependency
  - summarize_peru_former_criterion_data_strength
  - summarize_peru_former_population_by_pim_class
  - compare_peru_former_pim_sinpad_colocation
  - export_peru_former_raw_input_factor_maps
  - export_peru_former_pim_criteria_maps

# Scripts to exclude (by name, without .py). These are skipped even if their
# stage is listed above. Use this to skip DEPRECATED or one-off scripts.
exclude:
  - check_data_portals                # needs Chrome CDP, manual
  - download_zimbabwe_srtm_tiles            # needs raw data already planned
  - download_zimbabwe_chirps_rainfall_inputs # needs raw data already planned
  - download_zimbabwe_methodology_inputs    # needs raw data already planned
  - intake_mentor_voi_rainfall        # needs mentor zip
  - inventory_mentor_voi_rainfall_archive  # needs mentor zip
  - download_peru_former_worldpop_population_subset # network/large-download step; run explicitly
  - query_peru_former_sinpad_flood_events         # network ArcGIS query; run explicitly
  - query_peru_former_sernanp_protected_areas     # network ArcGIS query; run explicitly
  - derive_peru_former_soilgrids_kfactor   # network SoilGrids VRT window read; run explicitly
  - build_peru_former_rainfall_criterion          # remote CHIRPS COG reads; run explicitly
  - compare_peru_former_exposure_refresh          # one-off before/after diagnostic needs archived raster
  - derive_peru_former_usle_soil_loss       # legacy diagnostic; active Peru Sediment uses independent K/LS/C
  - export_paper_style_single_maps         # scenario-mean sensitivity appendix; run explicitly
  - run_zimbabwe_priority_scenarios      # archived Zimbabwe multi-scenario/equal-weight experiment
  - run_zimbabwe_rainfall_exposure       # archived Zimbabwe equal/direct comparison
  - run_zimbabwe_rainfall_sensitivity    # depends on archived Zimbabwe scenario comparison
  - diagnose_zimbabwe_hotspot_exposure   # depends on archived Zimbabwe scenario comparison
  - run_zimbabwe_mining_decay_priority_sensitivity # archived Zimbabwe equal/multi-scenario sensitivity

# When true, re-run scripts even if their outputs are newer than inputs.
force: false

# When true, stop at the first failed script. When false, continue and
# report all failures at the end.
stop_on_failure: true

# Scripts that may access remote services or download large files. They are
# removed from target dependency chains unless --allow-network is explicit.
network_scripts:
  - download_peru_former_worldpop_population_subset
  - query_peru_former_sinpad_flood_events
  - query_peru_former_sernanp_protected_areas
  - derive_peru_former_soilgrids_kfactor    # remote SoilGrids VRT window reads
  - build_peru_former_rainfall_criterion           # remote CHIRPS COG reads
