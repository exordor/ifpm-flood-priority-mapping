# IFPM pipeline configuration.
#
# Running `python bin/pipeline.py run` (no arguments) executes the full
# pipeline from this config: all stages, in dependency order, skipping
# scripts whose outputs are already fresh.
#
# Override on the command line:
#   python bin/pipeline.py run                      # full pipeline (this file)
#   python bin/pipeline.py run --target <name>      # one script + upstream
#   python bin/pipeline.py run factors              # one stage
#   python bin/pipeline.py run --force              # re-run everything
#   python bin/pipeline.py run --config other.yaml  # use a different config

# Stages to run, in canonical pipeline order. Omit a stage to skip it.
stages:
  - acquire
  - factors
  - criteria
  - scenarios
  - visualize
  - package
  - investigate

# The default and stage-level commands run only this Peru-first current chain.
# Historical Zimbabwe, equal-weight, superseded figure, and network acquisition
# scripts remain callable explicitly with --target when needed.
include:
  - export_peru_pilot_boundary
  - preprocess_srtm_peru_pilot_dem
  - derive_peru_pilot_slope
  - derive_peru_pilot_hydrology
  - derive_peru_pilot_ls_factor
  - derive_peru_pilot_worldcover_cfactor
  - extract_pe1_ingemmet_mining
  - extract_inei_arequipa_poverty
  - build_pe1_osm_proximity_criteria
  - build_pe1_soil_k_factor
  - build_pe1_criteria_stack
  - build_peru_exposure_indicators
  - build_pim_environmental_sensitivity
  - run_pe1_priority_scenarios
  - summarize_peru_criterion_dependency
  - summarize_peru_criterion_data_strength
  - summarize_peru_population_by_pim_class
  - compare_peru_pim_sinpad_colocation
  - export_peru_raw_input_factor_maps
  - export_peru_pim_criteria_maps
  - export_peru_direct_weight_priority_maps
  - export_peru_pim_contribution_map
  - export_peru_evidence_overlay_maps
  - build_peru_report_figure_chain

# Scripts to exclude (by name, without .py). These are skipped even if their
# stage is listed above. Use this to skip DEPRECATED or one-off scripts.
exclude:
  - derive_v1_chirps_rfactor          # DEPRECATED hard-stop
  - derive_v1_usle_soil_loss          # DEPRECATED hard-stop
  - derive_v2_rfactor_candidates      # DEPRECATED hard-stop
  - derive_v2_usle_soil_loss          # DEPRECATED hard-stop
  - compare_v2_rfactor_candidates     # DEPRECATED hard-stop
  - plot_v1_usle_soil_loss_board      # DEPRECATED hard-stop
  - plot_v2_rfactor_comparison_board  # DEPRECATED hard-stop
  - check_data_portals                # needs Chrome CDP, manual
  - download_srtm_v1_tiles            # needs raw data already planned
  - download_chirps_v1_rainfall_inputs # needs raw data already planned
  - download_v1_methodology_inputs    # needs raw data already planned
  - intake_mentor_voi_rainfall        # needs mentor zip
  - inventory_mentor_voi_rainfall_archive  # needs mentor zip
  - download_peru_worldpop_population_subset # network/large-download step; run explicitly
  - query_peru_sinpad_flood_events         # network ArcGIS query; run explicitly
  - query_peru_sernanp_protected_areas     # network ArcGIS query; run explicitly
  - derive_peru_pilot_soilgrids_kfactor   # network SoilGrids VRT window read; run explicitly
  - build_pe1_rainfall_criterion          # remote CHIRPS COG reads; run explicitly
  - compare_peru_exposure_refresh          # one-off before/after diagnostic needs archived raster
  - derive_peru_pilot_usle_soil_loss       # legacy diagnostic; active Peru Sediment uses independent K/LS/C
  - export_peru_conditioning_factor_maps   # superseded by raw-input and five-criterion current maps
  - export_paper_style_single_maps         # scenario-mean sensitivity appendix; run explicitly
  - export_single_priority_maps            # legacy cross-site sensitivity appendix; run explicitly
  - plot_zimbabwe_peru_prototype_comparison # legacy Peru multi-scenario mean/frequency consumer
  - plot_july18_integrated_priority_board   # legacy Peru top20-frequency consumer
  - plot_mentor_boss_priority_explanation_package # superseded pre-governance result package
  - run_boundary_v1_priority_scenarios      # archived Zimbabwe multi-scenario/equal-weight experiment
  - run_boundary_v1_rainfall_exposure       # archived Zimbabwe equal/direct comparison
  - run_boundary_v1_rainfall_sensitivity    # depends on archived Zimbabwe scenario comparison
  - diagnose_boundary_v1_hotspot_exposure   # depends on archived Zimbabwe scenario comparison
  - run_v1_mining_decay_priority_sensitivity # archived Zimbabwe equal/multi-scenario sensitivity
  - write_zimbabwe_peru_source_tables       # archived cross-site comparison writer

# When true, re-run scripts even if their outputs are newer than inputs.
force: false

# When true, stop at the first failed script. When false, continue and
# report all failures at the end.
stop_on_failure: true

# Scripts that may access remote services or download large files. They are
# removed from target dependency chains unless --allow-network is explicit.
network_scripts:
  - download_peru_worldpop_population_subset
  - query_peru_sinpad_flood_events
  - query_peru_sernanp_protected_areas
  - derive_peru_pilot_soilgrids_kfactor    # remote SoilGrids VRT window reads
  - build_pe1_rainfall_criterion           # remote CHIRPS COG reads
