      readme: |
        IFPM Goslar ReviewMap QGIS package

        Open IFPM_Goslar_ReviewMap.qgz. This version keeps the priority result, five weighted criteria, selected scored components, the original project focus anchor, boundary, mining context, and HWRM context. It omits terrain intermediates and other audit-only layers. The FullAudit processing chain remains in outputs/goslar_qgis_full_audit/IFPM_Goslar_FullAudit.qgz.
      portable_readme: |
        IFPM Goslar ReviewMap QGIS package

        Open IFPM_Goslar_ReviewMap.qgz directly in QGIS 3.44 or later. This version keeps the priority result, five weighted criteria, selected scored components, the original project focus anchor, WRRL reference boundary, 2017 flood impacts and emergency response (approximate locations), mining context, and HWRM context. It omits terrain intermediates and other audit-only layers. The orange dashed original focus anchor is visible, has weight 0, and must be contained by any future adopted Goslar study boundary. It is not a catchment, municipal boundary, or observed inundation footprint.
