# Former Peru area (peru_former): FROZEN baseline, verify-only.
# python -m ifpm run peru_former re-scores the PIM from the frozen criterion rasters into
# --out (default outputs/_rerun/peru_former/) and checks the sha256 pins in
# FROZEN_BASELINE.json. Nothing is ever written under outputs/peru_former_pim_chain/.
# Values are copied from bin/scenarios/run_peru_former_priority_scenarios.py (Supervisor full spec).

boundary_id: peru_hybas_l7_6070641200  # id written in the frozen tables (the area is now called peru_former)
experiment_id: priority_scenarios
scenario_id: mentor_peru_direct_pim
weight_source: mentor-recommended Peru direct weights, July 2026; no pairwise matrix supplied

weights:
  main: {flood_hazard: 0.34, sediment: 0.25, landuse_asm: 0.17, environmental: 0.10, socioeconomic: 0.14}
  components:
    flood_hazard: {rainfall_climatology: 0.35, twi_wetness: 0.25, drainage_proximity: 0.40}
    sediment: {soil_k_factor: 0.25, ls_factor: 0.50, c_factor: 0.25}
    landuse_asm: {land_cover_pressure: 0.40, bare_soil_vegetation_loss: 0.35, built_agriculture_road_expansion: 0.25}
    environmental: {water_wetland_context: 0.65, protected_ecological_context: 0.35}
    socioeconomic: {road_access_proximity: 0.35, settlement_population: 0.35, critical_infrastructure: 0.30}

extents:
  arequipa:
    method: rescore
    stages: [score]
    frozen_baseline: outputs/peru_former_pim_chain/FROZEN_BASELINE.json
    reference: outputs/peru_former_pim_chain/terrain_preprocessing/peru_former_dem_utm18s_30m.tif
    boundary: outputs/peru_former_boundary/peru_former_boundary.gpkg
    boundary_layer: peru_pilot_boundary
    out_dir: outputs/peru_former_pim_chain/priority_scenarios
    components:
      rainfall_climatology: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/rainfall_climatology_0_1.tif}
      twi_wetness: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/twi_wetness_0_1.tif}
      drainage_proximity: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/drainage_proximity_0_1.tif}
      soil_k_factor: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/soil_k_factor_0_1.tif}
      ls_factor: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/ls_factor_0_1.tif}
      c_factor: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/c_factor_0_1.tif}
      land_cover_pressure: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/land_cover_pressure_0_1.tif}
      bare_soil_vegetation_loss: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/bare_soil_vegetation_loss_0_1.tif}
      built_agriculture_road_expansion: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/built_agriculture_road_expansion_0_1.tif}
      water_wetland_context: {path: outputs/peru_former_pim_chain/environmental_sensitivity/water_wetland_context_0_1.tif}
      protected_ecological_context: {path: outputs/peru_former_pim_chain/environmental_sensitivity/protected_area_context_0_1.tif}
      road_access_proximity: {path: outputs/peru_former_pim_chain/criteria_stack/criteria/road_access_proximity_0_1.tif}
      settlement_population: {path: outputs/peru_former_pim_chain/exposure_indicators/population_exposure_0_1.tif}
      critical_infrastructure: {path: outputs/peru_former_pim_chain/exposure_indicators/built_infrastructure_exposure_0_1.tif}
    rules:
      divide_by_total: false
      clip_score: true
      min_common_fraction: 0.95
      evidence_rasters: true     # available weight, evidence count, support class, top-20% map
    verify:
      - outputs/peru_former_pim_chain/priority_scenarios/**/*.tif
      - outputs/peru_former_pim_chain/priority_scenarios/scenario_weights.csv
      - outputs/peru_former_pim_chain/priority_scenarios/scenario_priority_summary.csv
      - outputs/peru_former_pim_chain/priority_scenarios/*_grid_check.csv
