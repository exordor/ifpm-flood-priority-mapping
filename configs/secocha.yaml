# Secocha (Peru) chain settings for `python -m ifpm run secocha`.
#
# Values are copied from bin/factors/run_secocha_pim_chain.py, which ran the Goslar chain
# with Secocha paths and five Secocha-specific stages. Those five differences are the
# `terrain.dem_method`, `rainfall`, `protected_areas`, `exposure` and `criterion_support`
# settings below. Input dataset ids are defined in configs/datasets.yaml.

area: secocha
metric_crs: EPSG:32718      # UTM 18S
res_m: 30.0
nodata: -9999.0
log_prefix: peru-secocha

weights:
  main: {flood_hazard: 0.34, sediment: 0.25, landuse_asm: 0.17, environmental: 0.10, socioeconomic: 0.14}
  components:
    flood_hazard: {rainfall_climatology: 0.35, twi_wetness: 0.25, drainage_proximity: 0.40}
    sediment: {soil_k_factor: 0.25, ls_factor: 0.50, c_factor: 0.25}
    landuse_asm: {land_cover_pressure: 0.40, bare_soil_vegetation_loss: 0.35, built_agriculture_road_expansion: 0.25}
    environmental: {water_wetland_context: 0.65, protected_ecological_context: 0.35}
    socioeconomic: {road_access_proximity: 0.35, settlement_population: 0.35, critical_infrastructure: 0.30}
  built_agriculture_road: [0.50, 0.50]
# Secocha: a criterion is scored only where all its components are valid (no renormalization).
criterion_support: strict

luts:
  c_factor: {10: 0.001, 20: 0.010, 30: 0.020, 40: 0.200, 50: 0.050, 60: 0.700, 70: 0.000, 80: 0.000, 90: 0.050, 95: 0.010, 100: 0.030}
  land_use_pressure: {10: 0.10, 20: 0.15, 30: 0.20, 40: 0.80, 50: 1.00, 60: 0.25, 70: 0.00, 80: 0.00, 90: 0.00, 95: 0.00, 100: 0.10}
  land_cover_runoff_pressure: {10: 0.15, 20: 0.25, 30: 0.35, 40: 0.70, 50: 1.00, 60: 0.90, 70: 0.40, 80: 0.00, 90: 0.10, 95: 0.10, 100: 0.20}
  bare_soil_vegetation_loss: {10: 0.0, 20: 0.0, 30: 0.0, 40: 0.0, 50: 0.0, 60: 1.0, 70: 0.0, 80: 0.0, 90: 0.0, 95: 0.0, 100: 0.0}
  built_up_pressure: {10: 0.0, 20: 0.0, 30: 0.0, 40: 0.0, 50: 1.0, 60: 0.0, 70: 0.0, 80: 0.0, 90: 0.0, 95: 0.0, 100: 0.0}
  agricultural_pressure: {10: 0.0, 20: 0.0, 30: 0.0, 40: 1.0, 50: 0.0, 60: 0.0, 70: 0.0, 80: 0.0, 90: 0.0, 95: 0.0, 100: 0.0}
water_wetland_classes: [80, 90]

terrain:
  dem_method: srtm_zip            # NASA SRTMGL1 tile read from the zip, bilinear to the metric grid
  dem_buffer_m: 1000
  grid_rounding: ceil             # int(ceil(extent / res)) for the buffered grid
stream_threshold: 500
ls_cap: 50.0
k_si_factor: 0.1317

decay_m: {roads: 20000.0, water: 10000.0}

rainfall:
  method: chirps                  # CHIRPS v3 latam monthly, read over HTTP
  dataset: secocha_chirps_monthly
  months: [12, 1, 2, 3]           # December of year y, January-March of y+1
  season_years: [2014, 2023]      # inclusive first years of the seasons 2014/15-2023/24
  window_pad_deg: 0.2
# Protected areas: the SERNANP query returned no features; score 0 inside the extent.
protected_areas:
  method: confirmed_absence
  dataset: secocha_sernanp_query
# Exposure: WorldPop population; critical infrastructure = WorldCover built-up class.
exposure:
  method: worldpop
  dataset: secocha_worldpop

chain_files:
  DEM: terrain_preprocessing/secocha_dem_utm18s_30m.tif
  DEM_BUFFERED: terrain_preprocessing/secocha_dem_buffered_utm18s_30m.tif
  SLOPE: terrain_preprocessing/secocha_slope_degrees_utm18s_30m.tif
  SLOPE_BUFFERED: terrain_preprocessing/secocha_slope_degrees_buffered_utm18s_30m.tif
  FILLED: hydrology_derivatives/secocha_dem_filled.tif
  D8_PNTR: hydrology_derivatives/secocha_flow_direction_d8.tif
  FLOW_ACC_CELLS: hydrology_derivatives/secocha_flow_accumulation.tif
  FLOW_ACC_SCA: hydrology_derivatives/secocha_flow_accumulation_sca.tif
  STREAMS_T500: hydrology_derivatives/secocha_streams_t500.tif
  DISTANCE: hydrology_derivatives/secocha_distance_to_drainage_t500.tif
  TWI: hydrology_derivatives/secocha_twi.tif
  LS_CAPPED: ls_factor/secocha_ls_factor_capped50_hillslope_30m.tif
  K_ALIGNED: soil_k_factor/soil_k_factor_aligned_250m_effective_30m.tif
  K_SCORED: soil_k_factor/soil_k_factor_0_1.tif
  RAINFALL: rainfall_criterion/rainfall_climatology_0_1_PROVISIONAL_30m.tif
landcover_files:
  CFACTOR: c_factor_30m.tif
  LAND_USE_PRESSURE: land_use_pressure_30m.tif
  LAND_COVER_RUNOFF: land_cover_runoff_pressure_30m.tif
  BARE_SOIL_LOSS: bare_soil_vegetation_loss_proxy_30m.tif
  BUILT_UP_PRESSURE: built_up_pressure_30m.tif
  AGRICULTURAL_PRESSURE: agricultural_pressure_30m.tif
priority_filename: priority_secocha_direct_pim.tif

inputs:
  dem: secocha_srtm
  worldcover: secocha_worldcover
  soilgrids_k: secocha_soilgrids_k
  roads: secocha_osm_roads
  mining_overlay: secocha_mining_overlay

extents:
  reference:
    method: basin
    focus_area_id: secocha_reference_extent
    boundary: secocha_boundary
    chain_dir: outputs/secocha_pim_chain
    landcover_dir: outputs/secocha_pim_chain/worldcover_factors
    stages: [dem, slope, hydrology, ls_factor, worldcover_cfactor, soilgrids_kfactor, osm_roads,
             rainfall, protected_areas, criteria_stack, exposure_indicators,
             environmental_sensitivity, priority_scenarios, validate]
    verify:
      - outputs/secocha_pim_chain/criteria_stack/criteria/*.tif
      - outputs/secocha_pim_chain/priority_scenarios/pim_criteria/*.tif
      - outputs/secocha_pim_chain/priority_scenarios/scenarios/*.tif
      - outputs/secocha_pim_chain/priority_scenarios/*.tif
      - outputs/secocha_pim_chain/quality_assurance/*.json
    # Accepted differences (status KNOWN, counted as pass while the difference stays within
    # max_diff). The rerun burns 3 extra road cells in column 166 (rows 90, 102, 170;
    # east edge x=696500): road ends clipped at the boundary land one floating-point step
    # inside the grid edge with this GEOS/GDAL build. The other files inherit the change.
    known_differences:
      reason: 3 edge road cells at column 166 (x=696500) from floating-point clipping
      max_diff: 2.0e-3
      files:
        - outputs/secocha_pim_chain/criteria_stack/criteria/road_access_proximity_0_1.tif
        - outputs/secocha_pim_chain/criteria_stack/criteria/built_agriculture_road_expansion_0_1.tif
        - outputs/secocha_pim_chain/priority_scenarios/pim_criteria/landuse_asm_0_1.tif
        - outputs/secocha_pim_chain/priority_scenarios/pim_criteria/socioeconomic_0_1.tif
        - outputs/secocha_pim_chain/priority_scenarios/scenarios/priority_secocha_direct_pim.tif

# Validation (python -m ifpm run secocha --step validate): grid, value-range and class
# checks plus point sampling of the event evidence. Writes quality_assurance/chain_validation.json.
validation:
  evidence:
    - [INGEMMET A7367 field anchor, secocha_field_anchors]
    - [INDECI response location, secocha_indeci_locations]
    - [INGEMMET mining record, secocha_mining_overlay]
  frozen_baseline: peru_former_frozen_baseline
  experiment_id: supervisor_full_spec_v07_secocha

manifest:
  experiment_id: supervisor_full_spec_v07_secocha
  boundary_role: A7367 Map 7 coordinate-frame diagnostic extent; not catchment or event footprint
  claim_level: provisional
  nodata_policy: strict common support within each criterion and across the five main criteria; no weight renormalization on missing components
  mining_role: external overlay only; excluded from PIM score
  data_sources:
    dem: NASA SRTMGL1 S16W074, 1 arc-second
    rainfall: CHIRPS v3 Dec-Mar 2014/15-2023/24, 0.05 degree native
    land_cover: ESA WorldCover 2021 v200, 10 m native
    soil: ISRIC SoilGrids 250 m effective resolution
    roads: Geofabrik Peru OSM extract
    population: WorldPop Peru 2020 UN-adjusted
    protected_areas: SERNANP layer 0 query; zero features within 25 km
  note: Active Peru Secocha prototype using unchanged Supervisor v07 weights; not a final flood-risk result.

# QGIS review packages (python -m ifpm qgis secocha): one workspace-linked project under out_dir and
# one self-contained portable copy under portable_dir (plus a zip). ReviewMap keeps the listed
# layer keys of FullAudit; `visible` replaces the default visibility. Ported from
# bin/package/build_secocha_qgis_full_audit.py and build_secocha_qgis_review.py.
qgis:
  site_key: secocha
  project_crs: EPSG:32718
  lineage:
    proxy_lineage:
      path: outputs/secocha_official_proxy_replacements/proxy_replacement_manifest.json
      template: dataset_id=secocha_official_proxy_replacements; source_manifest_sha256={sha256}.
  layers:
  - key: priority
    name: Relative priority index
    group: 1. Priority result
    path: outputs/secocha_pim_chain/priority_scenarios/scenarios/priority_secocha_direct_pim.tif
    kind: raster
    role: priority_result
    palette: priority
    visible: true
    unit: 0-1
    claim_level: provisional
    notes: Active Secocha Peru prototype with unchanged Supervisor v07 weights; mining is excluded from the score.
  - key: flood_hazard
    name: Flood-conditioning indicator (FH | PIM weight 0.34)
    group: 2. Five PIM criteria
    path: outputs/secocha_pim_chain/priority_scenarios/pim_criteria/flood_hazard_0_1.tif
    kind: raster
    role: criterion
    palette: flood_hazard
    unit: 0-1
    claim_level: provisional
  - key: sediment
    name: Sediment / erosion score (SE | PIM weight 0.25)
    group: 2. Five PIM criteria
    path: outputs/secocha_pim_chain/priority_scenarios/pim_criteria/sediment_0_1.tif
    kind: raster
    role: criterion
    palette: sediment
    unit: 0-1
    claim_level: provisional
  - key: landuse_asm
    name: Land-use pressure score (LU | PIM weight 0.17)
    group: 2. Five PIM criteria
    path: outputs/secocha_pim_chain/priority_scenarios/pim_criteria/landuse_asm_0_1.tif
    kind: raster
    role: criterion
    palette: landuse_asm
    unit: 0-1
    claim_level: provisional
  - key: environmental
    name: Environmental context indicator (ES | PIM weight 0.10)
    group: 2. Five PIM criteria
    path: outputs/secocha_pim_chain/priority_scenarios/pim_criteria/environmental_0_1.tif
    kind: raster
    role: criterion
    palette: environmental
    unit: 0-1
    claim_level: provisional
  - key: socioeconomic
    name: Socioeconomic exposure indicator (SV | PIM weight 0.14)
    group: 2. Five PIM criteria
    path: outputs/secocha_pim_chain/priority_scenarios/pim_criteria/socioeconomic_0_1.tif
    kind: raster
    role: criterion
    palette: socioeconomic
    unit: 0-1
    claim_level: provisional
  - key: elevation
    name: Elevation (SRTM 1 arc-second)
    group: 3. Terrain and hydrology
    path: outputs/secocha_pim_chain/terrain_preprocessing/secocha_dem_utm18s_30m.tif
    kind: raster
    role: input_factor
    palette: terrain
    unit: m
  - key: slope
    name: Slope
    group: 3. Terrain and hydrology
    path: outputs/secocha_pim_chain/terrain_preprocessing/secocha_slope_degrees_utm18s_30m.tif
    kind: raster
    role: input_factor
    palette: slope
    unit: degrees
  - key: flow_accumulation
    name: Flow accumulation (contributing cells)
    group: 3. Terrain and hydrology
    path: outputs/secocha_pim_chain/hydrology_derivatives/secocha_flow_accumulation.tif
    kind: raster
    role: input_factor
    palette: hydrology
    unit: cells
  - key: streams
    name: Derived drainage (threshold 500 cells)
    group: 3. Terrain and hydrology
    path: outputs/secocha_pim_chain/hydrology_derivatives/secocha_streams_t500.tif
    kind: raster
    role: input_factor
    palette: hydrology
    unit: stream mask
  - key: distance_drainage
    name: Distance to derived drainage (FH component weight 0.40)
    group: 3. Terrain and hydrology
    path: outputs/secocha_pim_chain/hydrology_derivatives/secocha_distance_to_drainage_t500.tif
    kind: raster
    role: input_factor
    palette: distance
    unit: m
    notes: Raw distance input; weight applies after inversion and standardization to the drainage_proximity component.
  - key: twi
    name: Topographic wetness index (FH component weight 0.25)
    group: 3. Terrain and hydrology
    path: outputs/secocha_pim_chain/hydrology_derivatives/secocha_twi.tif
    kind: raster
    role: input_factor
    palette: wetness
    unit: TWI
    notes: Raw TWI input; weight applies after percentile standardization.
  - key: ls_factor
    name: LS factor, capped at 50 (SE component weight 0.50)
    group: 4. Erosion and land cover
    path: outputs/secocha_pim_chain/ls_factor/secocha_ls_factor_capped50_hillslope_30m.tif
    kind: raster
    role: input_factor
    palette: erosion
    unit: LS
    notes: Raw LS input; weight applies after percentile standardization.
  - key: soil_k
    name: Soil erodibility K factor, SoilGrids (SE component weight 0.25)
    group: 4. Erosion and land cover
    path: outputs/secocha_pim_chain/soil_k_factor/soil_k_factor_aligned_250m_effective_30m.tif
    kind: raster
    role: input_factor
    palette: erosion
    unit: K
    notes: Raw K input; weight applies after percentile standardization. 250 m effective source resolution, resampled to the overlay grid.
  - key: c_factor
    name: Cover-management C factor, WorldCover (SE component weight 0.25)
    group: 4. Erosion and land cover
    path: outputs/secocha_pim_chain/worldcover_factors/c_factor_30m.tif
    kind: raster
    role: input_factor
    palette: erosion
    unit: C
    notes: Raw C input; weight applies after percentile standardization.
  - key: land_pressure
    name: Land-cover pressure, WorldCover (LU component weight 0.40)
    group: 4. Erosion and land cover
    path: outputs/secocha_pim_chain/worldcover_factors/land_cover_runoff_pressure_30m.tif
    kind: raster
    role: input_factor
    palette: land
    unit: 0-1
  - key: bare_soil
    name: Bare-soil / vegetation-loss proxy (LU component weight 0.35)
    group: 4. Erosion and land cover
    path: outputs/secocha_pim_chain/criteria_stack/criteria/bare_soil_vegetation_loss_0_1.tif
    kind: raster
    role: input_factor
    palette: land
    unit: 0-1
    notes: Active bare_soil_vegetation_loss component; WorldCover bare/sparse class proxy.
  - key: built_agri_road
    name: Built, agriculture and road pressure (LU component weight 0.25)
    group: 4. Erosion and land cover
    path: outputs/secocha_pim_chain/criteria_stack/criteria/built_agriculture_road_expansion_0_1.tif
    kind: raster
    role: input_factor
    palette: land
    unit: 0-1
    notes: Active built_agriculture_road_expansion component.
  - key: rainfall
    name: Rainfall climatology, CHIRPS Dec-Mar (FH component weight 0.35)
    group: 5. Rainfall
    path: outputs/secocha_pim_chain/rainfall_criterion/rainfall_climatology_0_1_PROVISIONAL_30m.tif
    kind: raster
    role: input_factor
    palette: rainfall
    unit: 0-1
    claim_level: sensitivity_scenario
    notes: Standardized FH rainfall component. CHIRPS 0.05 degree native; bilinear 30 m resample is only for overlay compatibility.
  - key: population
    name: Population exposure, WorldPop 2020 (SV component weight 0.35)
    group: 6. Exposure and environment
    path: outputs/secocha_pim_chain/exposure_indicators/population_exposure_0_1.tif
    kind: raster
    role: input_factor
    palette: population
    unit: 0-1
    notes: Standardized settlement_population component.
  - key: built
    name: Built-up exposure proxy, WorldCover (SV component weight 0.30)
    group: 6. Exposure and environment
    path: outputs/secocha_pim_chain/exposure_indicators/built_infrastructure_exposure_0_1.tif
    kind: raster
    role: input_factor
    palette: population
    unit: 0-1
    notes: Active critical_infrastructure component as a built-up land-cover proxy; not a facility inventory.
  - key: road_access
    name: Road-access proximity, OSM (SV component weight 0.35)
    group: 6. Exposure and environment
    path: outputs/secocha_pim_chain/criteria_stack/criteria/road_access_proximity_0_1.tif
    kind: raster
    role: input_factor
    palette: distance
    unit: 0-1
    notes: Active road_access_proximity component with 20 km linear decay.
  - key: water_wetland
    name: Water and wetland context (ES component weight 0.65)
    group: 6. Exposure and environment
    path: outputs/secocha_pim_chain/environmental_sensitivity/water_wetland_context_0_1.tif
    kind: raster
    role: input_factor
    palette: wetness
    unit: 0-1
    notes: Active water_wetland_context component.
  - key: protected
    name: Protected-area context, confirmed layer-0 absence (ES component weight 0.35)
    group: 6. Exposure and environment
    path: outputs/secocha_pim_chain/environmental_sensitivity/protected_area_context_0_1.tif
    kind: raster
    role: input_factor
    palette: land
    unit: 0-1
    notes: Active protected_ecological_context component. SERNANP layer 0 returned zero features within 25 km; other protection categories were not queried.
  - key: boundary
    name: Active Secocha working boundary (A7367 map frame)
    group: 7. External validation and overlays
    path: outputs/secocha_boundary/secocha_boundary.gpkg
    kind: vector
    role: boundary
    visible: true
    layer_name: secocha_active_boundary
    claim_level: working_boundary
    notes: Not an event footprint or catchment boundary.
  - key: original_a7367
    name: INGEMMET original A7367 hazard polygons
    group: 7. External validation and overlays
    path: data/raw/ingemmet_a7367_cartografia_peligros_secocha/ingemmet_a7367_cartografia_peligros_layer6_secocha.geojson
    kind: vector
    role: original_hazard
    visible: true
    layer_name: ingemmet_a7367_cartografia_peligros_layer6_secocha
    claim_level: context_evidence
    notes: Original INGEMMET Cartografia de Peligros layer 6 query; three A7367 polygons. General geological-hazard cartography, not automatically the observed 5 February footprint.
  - key: event_footprint
    name: 5 February event footprint candidate
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/observed_hazard/secocha_2023_map7_event_digitization.gpkg
    kind: vector
    role: event_footprint
    visible: true
    layer_name: event_footprint_candidate
    claim_level: validation_candidate
    notes: Union of the two explicit 5 February classes from A7367 Map 7; semi-automatic report-map digitization.
  - key: event_huaico
    name: 5 February huaico candidate
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/observed_hazard/secocha_2023_map7_event_digitization.gpkg
    kind: vector
    role: event_huaico
    visible: true
    layer_name: huaico_2023_02_05
    claim_level: validation_candidate
    notes: Legend-colour extraction of Huaico del 5 de febrero from A7367 Map 7.
  - key: event_mudflow
    name: 5 February mudflow candidate
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/observed_hazard/secocha_2023_map7_event_digitization.gpkg
    kind: vector
    role: event_mudflow
    visible: true
    layer_name: mudflow_2023_02_05
    claim_level: validation_candidate
    notes: Legend-colour extraction of Flujo de lodo del 5 de febrero from A7367 Map 7.
  - key: mining
    name: INGEMMET mining records (external overlay)
    group: 7. External validation and overlays
    path: data/raw/ingemmet_catastro_minero_secocha/secocha_pequena_mineria.gpkg
    kind: vector
    role: evidence_points
    visible: true
    layer_name: pequena_mineria
    claim_level: context_evidence
    notes: Reference/cadastral records; not verified active extraction. External overlay only; excluded from the PIM score.
  - key: minedu_schools_2023
    name: MINEDU educational locations (2023 statistical references)
    group: 7. External validation and overlays
    path: outputs/secocha_official_proxy_replacements/secocha_official_exposure_mining.gpkg
    kind: vector
    role: evidence_points
    visible: false
    layer_name: minedu_education_locations_2023
    claim_level: context_evidence
    notes: 'Official 2023 education register: 47 context locations, including 11 missing-CODLOCAL service-level locations; 12 locations are inside the active frame. Statistical reference points, not building-accurate or confirmed operational on 5 February. Reported student/teacher fields are service-row sums. Excludes director/contact fields and enters no PIM input. {proxy_lineage}'
  - key: minam_health_facilities
    name: MINAM health-facility locations (25 km context)
    group: 7. External validation and overlays
    path: outputs/secocha_official_proxy_replacements/secocha_official_exposure_mining.gpkg
    kind: vector
    role: evidence_points
    visible: false
    layer_name: minam_health_facilities_context
    claim_level: context_evidence
    notes: Four official health-facility records within the exact 25 km context and none inside the active frame; live-source event-date status is not established. Source warns points may represent populated-centre locations, not exact building positions. {proxy_lineage}
  - key: ingemmet_mining_rights
    name: INGEMMET mining-right polygons (exact 5 km context)
    group: 7. External validation and overlays
    path: outputs/secocha_official_proxy_replacements/secocha_official_exposure_mining.gpkg
    kind: vector
    role: mining_context_overlay
    visible: false
    layer_name: ingemmet_mining_rights
    claim_level: context_evidence
    notes: Official referential legal/cadastral rights with status; 173 polygons remain after exact 5 km filtering and 47 have reportable positive-area overlap (at least 1 m2) with the active frame. Not verified active extraction footprints and excluded from PIM. {proxy_lineage}
  - key: ingemmet_dgm_activity
    name: 'INGEMMET DGM concession status: EXPLOTACION (exact 5 km context)'
    group: 7. External validation and overlays
    path: outputs/secocha_official_proxy_replacements/secocha_official_exposure_mining.gpkg
    kind: vector
    role: mining_context_overlay
    visible: false
    layer_name: ingemmet_dgm_activity
    claim_level: context_evidence
    notes: Two DGM administrative concession records labelled ESTADO_MINEM=EXPLOTACION occur within the exact 5 km context; neither intersects the active frame. Active extraction is not field-verified, informal activity is not ruled out, and the layer is excluded from PIM. {proxy_lineage}
  - key: field_anchors
    name: INGEMMET A7367 field anchors
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/ingemmet_field_anchors.geojson
    kind: vector
    role: evidence_points
    visible: true
    layer_name: ingemmet_field_anchors
    claim_level: validation_candidate
    notes: Report-derived field anchors, not a complete event footprint.
  - key: response_locations
    name: INDECI response locations
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/indeci_response_locations.geojson
    kind: vector
    role: evidence_points
    visible: true
    layer_name: indeci_response_locations
    claim_level: validation_candidate
    notes: Report-derived affected/response locations; report date retained in evidence table.
  - key: s2_ndwi_before
    name: Sentinel-2 NDWI, 3 Feb pre-event
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/satellite_before_after/processed/s2_ndwi_before_10m.tif
    kind: raster
    role: validation_raster
    palette: wetness
    unit: NDWI
    claim_level: validation_candidate
    notes: NDWI=(B03-B08)/(B03+B08); SCL 4-7 valid. Validation context only; does not enter the PIM score.
  - key: s2_ndwi_after
    name: Sentinel-2 NDWI, 8 Feb post-event
    group: 7. External validation and overlays
    path: outputs/secocha_2023_validation/satellite_before_after/processed/s2_ndwi_after_10m.tif
    kind: raster
    role: validation_raster
    palette: wetness
    unit: NDWI
    claim_level: validation_candidate
