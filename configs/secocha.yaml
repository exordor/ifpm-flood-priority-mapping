      portable_readme: |
        IFPM Peru Secocha QGIS FullAudit package

        Open IFPM_Peru_Secocha_FullAudit.qgz in QGIS. The groups show the complete chain from terrain and hydrology through the five PIM criteria and relative priority result, plus separate A7367 Map 7 huaico and mudflow event candidates. All paths are package-local. The map-frame boundary is diagnostic, not a catchment. Event polygons are semi-automatic report-map digitization candidates. Mining records are external overlays only and do not enter the score. CHIRPS and SoilGrids retain their native-resolution warnings. The FullAudit package includes processed Sentinel-2 validation context plus newly acquired MINEDU 2023 statistical education locations, MINAM health-facility context, INGEMMET mining-right polygons and DGM administrative concession status (ESTADO_MINEM=EXPLOTACION). These four official layers are default-disabled and remain outside PIM: the facility points are not confirmed building-accurate/event-date observations, and mining status is not field-verified active extraction. This is a provisional research prototype, not a final flood-risk or emergency-response map.
